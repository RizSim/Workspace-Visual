<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
    <style>
h1 {
    background-color:aqua;
    text-align: center;
}
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
th, td {
  padding: 5px;
  text-align: left;
  width="120" height="50"
}

#th1, #th2, #th3,#td1, #td2, #td3 ,#td4 ,#td5,#td6 {
  float: left;
  width: 100px;
  height: 35px;
  margin: 10px;
  padding: 10px;
  border: 1px solid black;
}

    </style>
    <script>
function allowDrop(ev) {
  ev.preventDefault();
}

function drag(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
  ev.preventDefault();
  var data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}


    </script>
</head>
<body>

<h1>This is a Heading</h1>
<p>This is a paragraph.</p>


<h2>Table Caption</h2>
<p>To add a caption to a table, use the caption tag.</p>

<table style="width:70%">
    <caption>Titolo tabella</caption>
    <tr>
        <th id="th1" ondrop="drop(event)" ondragover="allowDrop(event)">
            <img src="img_w3slogo.gif" draggable="true" ondragstart="drag(event)" id="drag1" width="88" height="31">
        </th>
        <th id="th2" ondrop="drop(event)" ondragover="allowDrop(event)"></th>
         <th id="th3" ondrop="drop(event)" ondragover="allowDrop(event)"></th>
    </tr>
    <tr>
        <td id="td1" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
        <td id="td2" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
        <td id="td3" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
    </tr>
    <tr>
        <td id="td4" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
        <td id="td5" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
        <td id="td6" ondrop="drop(event)" ondragover="allowDrop(event)"></td>
    </tr>
</table>

</body>
</html>
