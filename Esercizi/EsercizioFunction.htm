<!DOCTYPE html>
<html>

<head>
  <h1>Testata h1 </h1>
</head>

<body>


  <h2>Demo JavaScript in Corpo</h2>

  <script>
    function myFunction() {
      document.getElementById("demo").innerHTML = "Paragrafo cambiato";
      document.getElementById("demo").style.color = "blue";
    }
  </script>

  <script>
    window.alert("Parte con una scritta" + 5 + 6);
  </script>

  <p id="demo">Un paragrafo.</p>
  <p id="demo2">Un altro paragrafo.</p>

  <button type="button" onclick="myFunction()">Prova</button>


  <p>Click the button to print the current page.</p>

  <button onclick="window.print()">Stampa</button>


</body>

</html>
