<body>

<h2>JavaScript Arrays</h2>

<object id="svg-object" data="../SVG/Brill.svg" type="image/svg+xml"></object>

<p id="demo"></p>


<script>
const Col =
[
  ["Purple color names","Violet","EE82EE"],
  ["Purple color names","Orchid","DA70D6"],
  ["Purple color names","Fuchsia","FF00FF"],
  ["Purple color names","Magenta","FF00FF"],
  ["Purple color names","MediumOrchid","BA55D3"],
  ["Purple color names","MediumPurple","9370DB"],
  ["Purple color names","Amethyst","9966CC"],
  ["Purple color names","BlueViolet","8A2BE2"],
  ["Purple color names","DarkViolet","9400D3"],
  ["Purple color names","DarkOrchid","9932CC"],
  ["Purple color names","DarkMagenta","8B008B"],
  ["Purple color names","Purple","800080"],
  ["Purple color names","Indigo","4B0082"],
  ["Purple color names","SlateBlue","6A5ACD"],
  ["Purple color names","DarkSlateBlue","483D8B"],
  ["Purple color names","MediumSlateBlue","7B68EE"],
  ["Green color names","GreenYellow","ADFF2F"],
  ["Green color names","Chartreuse","7FFF00"],
  ["Green color names","LawnGreen","7CFC00"],
  ["Green color names","Lime","00FF00"],
  ["Green color names","LimeGreen","32CD32"],
  ["Green color names","PaleGreen","98FB98"],
];

let text = "<ul>";
Col.forEach(myFunction);
text += "</ul>";
document.getElementById("demo").innerHTML = text;


function myFunction(value) {
  text += "<li style=\"color:#"+value[2]+"\">"+ value[0]+" _ " + value[1]+" _ "+value[2] + "</li>";
}
</script>
